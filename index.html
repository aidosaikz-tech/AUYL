<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Өз ауылыңды құр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--panel:#fffaf0;--ink:#2b2418;--muted:#7a6e5b;--line:#e8dcc4;--gold:#e9a825;--gold-d:#b97d0b;--green:#4f9d3a;--green-d:#33702a;--red:#d3483b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#2a2418;color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;border:0;cursor:pointer;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;background:#f6b93b;color:#3a2604;font-weight:800;font-size:12px;padding:3px 8px;border-radius:7px;
  box-shadow:0 2px 6px rgba(0,0,0,.35);transform-origin:50% 100%}
.lbl::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#f6b93b}
.lbl i{font-style:normal;background:#3a2604;color:#f6b93b;border-radius:5px;padding:0 4px;margin-left:3px;font-size:10px}
.lbl.b{background:#fffaf0;color:#5a4a2a}.lbl.b::after{border-top-color:#fffaf0}
.lbl.f{background:rgba(30,24,14,.78);color:#fff}.lbl.f::after{border-top-color:rgba(30,24,14,.78)}
.mini{display:inline-block;width:20px;height:14px;border-radius:2px;text-align:center;font-size:10px;line-height:14px;vertical-align:-2px}
.err{position:absolute;top:45%;left:10%;right:10%;background:#fff;padding:16px;border-radius:12px;text-align:center;font-weight:700}
/* жоғарғы панель */
#top{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 10px 18px;background:linear-gradient(rgba(30,22,10,.72),rgba(30,22,10,.35) 70%,transparent);pointer-events:none}
#top>*{pointer-events:auto}
#hdr{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.flagbox{flex:none;width:44px;height:30px;border-radius:5px;display:grid;place-items:center;font-size:17px;box-shadow:0 2px 0 rgba(0,0,0,.3),inset 0 0 0 2px rgba(255,255,255,.35);position:relative;overflow:hidden}
.flagbox::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);animation:wave 3s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateX(-60%)}50%{transform:translateX(60%)}}
.vname{font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5);line-height:1.1}
.vtitle{font-size:12px;color:#ffeccc;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.score{margin-left:auto;background:rgba(0,0,0,.45);color:#ffe08a;font-weight:800;border-radius:20px;padding:5px 10px;font-size:14px;white-space:nowrap}
#res{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}#res::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;min-width:58px;background:rgba(255,250,240,.93);border-radius:10px;padding:3px 7px;display:flex;align-items:center;gap:4px;font-weight:800;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.chip b{font-size:15px}.chip small{display:block;font-size:9.5px;font-weight:600;color:var(--green-d);margin-top:-2px}
#stats{display:flex;justify-content:space-around;margin-top:6px;color:#fff;font-size:12.5px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#stats b{color:#ffe08a}
#camctl{position:fixed;right:10px;top:calc(150px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:7px}
#camctl button{width:40px;height:40px;border-radius:12px;background:rgba(255,250,240,.9);font-size:19px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.hint{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,22,10,.65);color:#fff;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;pointer-events:none;white-space:nowrap;transition:opacity 1s}
.float{position:fixed;pointer-events:none;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.6);animation:up 1.4s ease-out forwards;z-index:50;transform:translate(-50%,-100%)}
@keyframes up{to{margin-top:-50px;opacity:0}}
/* төменгі мәзір */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(500px,calc(100% - 20px));display:flex;background:#fffaf0;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.35);padding:5px;z-index:10}
#nav button{flex:1;background:none;padding:6px 0;border-radius:13px;font-size:22px;line-height:1;position:relative}
#nav button span{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:3px}
#nav button:active{background:#f3e6c6}
.dot{position:absolute;top:3px;right:calc(50% - 18px);width:9px;height:9px;background:var(--red);border-radius:50%;border:2px solid #fffaf0}
/* терезелер */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}#shade.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(520px,100%);max-height:56vh;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));z-index:30;transition:transform .28s cubic-bezier(.2,.9,.3,1.1)}
#sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:3px;background:#d8c9a8;margin:0 auto 10px}
h2{margin:0 0 4px;font-size:20px}.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:#f1e6cc;border-radius:20px;padding:7px 12px;font-weight:700;font-size:13px}.tabs button.on{background:var(--ink);color:#fff}
.card{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px;margin-bottom:8px}
.card .big{font-size:34px;width:46px;text-align:center;flex:none}.card .info{flex:1;min-width:0}.card .nm{font-weight:800;font-size:15px}
.card .ds{font-size:12px;color:var(--muted);margin-top:2px}.card .cs{font-size:12.5px;font-weight:700;margin-top:4px}.card .cs .no{color:var(--red)}.card.lock{opacity:.55}
.btn{background:var(--green);color:#fff;font-weight:800;border-radius:12px;padding:10px 14px;box-shadow:0 3px 0 var(--green-d);font-size:14px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-d)}.btn.gold{background:var(--gold);box-shadow:0 3px 0 var(--gold-d);color:#3b2a05}
.btn.gray{background:#cfc4ad;box-shadow:0 3px 0 #a99d84;color:#4a4232}.btn.red{background:var(--red);box-shadow:0 3px 0 #9c2f25}
.btn.wide{width:100%;padding:13px;font-size:16px;margin-top:8px}.btn:disabled{filter:grayscale(1);opacity:.6}
.row{display:flex;gap:8px}.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}.kv b{font-weight:800}
input.name{width:100%;font:inherit;font-size:17px;font-weight:700;padding:11px;border-radius:12px;border:2px solid var(--line);background:#fff;user-select:text;-webkit-user-select:text}
.colors,.syms{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:8px 0 14px}
.colors button{aspect-ratio:1;border-radius:10px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.colors button.on,.syms button.on{outline:3px solid var(--ink);outline-offset:2px}
.syms button{aspect-ratio:1;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:22px}.syms button.lk{opacity:.35}
.bigflag{width:150px;height:96px;margin:6px auto 14px;font-size:44px;border-radius:8px}
.track{background:#c79a5b;border-radius:14px;padding:8px 8px 8px 0;position:relative;margin:10px 0;background-image:repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.12) 38px 40px)}
.track::after{content:"🏁";position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:26px}
.lane{height:46px;position:relative;border-bottom:2px dashed rgba(255,255,255,.35)}.lane:last-child{border:0}
.horse{position:absolute;left:4px;top:4px;font-size:34px;transform:scaleX(-1);transition:left linear}
.lane label{position:absolute;left:52px;top:13px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:7px}.pick button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;font-weight:800}.pick button.on{border-color:var(--ink);background:#f3e6c6}
.ach{display:flex;gap:10px;align-items:center;padding:9px;border-radius:12px;background:#fff;border:1px solid var(--line);margin-bottom:7px}
.ach .i{font-size:28px;width:38px;text-align:center}.ach.off{opacity:.5;filter:grayscale(.8)}.ach .r{margin-left:auto;font-size:12px;font-weight:800;white-space:nowrap}
.toast{position:fixed;left:50%;top:calc(120px + env(safe-area-inset-top));transform:translate(-50%,-30px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:60;transition:all .3s;max-width:90%;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.35);pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.center{text-align:center}.giftbox{font-size:84px;text-align:center;margin:8px 0;animation:bounce 1.2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="top">
  <div id="hdr"><div id="hflag"></div><div><div class="vname" id="hname">Ауыл</div><div class="vtitle" id="htitle"></div></div><div class="score" id="hscore">⭐ 0</div></div>
  <div id="res"></div><div id="stats"></div>
</div>
<div id="camctl"><button id="rotL">⟲</button><button id="rotR">⟳</button><button id="home">🎯</button></div>
<div class="hint" id="hint">👆 Бос жерді бас · ✋ жылжыт · 🤏 екі саусақпен айналдыр</div>
<div id="nav">
  <button data-p="build">🏗<span>Салу</span></button>
  <button data-p="games">🐎<span>Бәйге</span></button>
  <button data-p="gift">🎁<span>Сыйлық</span><i class="dot" id="giftdot" hidden></i></button>
  <button data-p="ach">🎖<span>Жетістік</span></button>
  <button data-p="me">🚩<span>Ауылым</span></button>
</div>
<div id="shade"></div>
<div id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ═══════════ «Өз ауылыңды құр» — 3D қозғалтқыш (WebGL1, кітапханасыз) ═══════════ */
"use strict";
/* ── Матрицалар ── */
const M4 = {
  I(){ const o=new Float32Array(16); o[0]=o[5]=o[10]=o[15]=1; return o },
  mul(a,b){ const o=new Float32Array(16); for(let c=0;c<4;c++) for(let r=0;r<4;r++){ let s=0; for(let k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k]; o[c*4+r]=s } return o },
  T(x,y,z){ const o=M4.I(); o[12]=x;o[13]=y;o[14]=z; return o },
  S(x,y=x,z=x){ const o=M4.I(); o[0]=x;o[5]=y;o[10]=z; return o },
  RY(a){ const c=Math.cos(a),s=Math.sin(a),o=M4.I(); o[0]=c;o[2]=-s;o[8]=s;o[10]=c; return o },
  RX(a){ const c=Math.cos(a),s=Math.sin(a),o=M4.I(); o[5]=c;o[6]=s;o[9]=-s;o[10]=c; return o },
  RZ(a){ const c=Math.cos(a),s=Math.sin(a),o=M4.I(); o[0]=c;o[1]=s;o[4]=-s;o[5]=c; return o },
  chain(...ms){ return ms.reduce((a,b)=>M4.mul(a,b)) },
  persp(fov,asp,n,f){ const t=1/Math.tan(fov/2),o=new Float32Array(16); o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f); return o },
  ortho(l,r,b,t,n,f){ const o=M4.I(); o[0]=2/(r-l);o[5]=2/(t-b);o[10]=-2/(f-n);o[12]=-(r+l)/(r-l);o[13]=-(t+b)/(t-b);o[14]=-(f+n)/(f-n); return o },
  look(e,t,u=[0,1,0]){
    let z=[e[0]-t[0],e[1]-t[1],e[2]-t[2]]; let L=Math.hypot(...z); z=z.map(v=>v/L);
    let x=[u[1]*z[2]-u[2]*z[1],u[2]*z[0]-u[0]*z[2],u[0]*z[1]-u[1]*z[0]]; L=Math.hypot(...x); x=x.map(v=>v/L);
    const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
    const o=new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,0,0,0,1]);
    o[12]=-(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]); o[13]=-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]); o[14]=-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]); return o },
  inv(a){ const o=new Float32Array(16);
    const [a00,a01,a02,a03,a10,a11,a12,a13,a20,a21,a22,a23,a30,a31,a32,a33]=a;
    const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,
      b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
    let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06; if(!d) return o; d=1/d;
    o[0]=(a11*b11-a12*b10+a13*b09)*d;o[1]=(a02*b10-a01*b11-a03*b09)*d;o[2]=(a31*b05-a32*b04+a33*b03)*d;o[3]=(a22*b04-a21*b05-a23*b03)*d;
    o[4]=(a12*b08-a10*b11-a13*b07)*d;o[5]=(a00*b11-a02*b08+a03*b07)*d;o[6]=(a32*b02-a30*b05-a33*b01)*d;o[7]=(a20*b05-a22*b02+a23*b01)*d;
    o[8]=(a10*b10-a11*b08+a13*b06)*d;o[9]=(a01*b08-a00*b10-a03*b06)*d;o[10]=(a30*b04-a31*b02+a33*b00)*d;o[11]=(a21*b02-a20*b04-a23*b00)*d;
    o[12]=(a11*b07-a10*b09-a12*b06)*d;o[13]=(a00*b09-a01*b07+a02*b06)*d;o[14]=(a31*b01-a30*b03-a32*b00)*d;o[15]=(a20*b03-a21*b01+a22*b00)*d; return o },
  xf(m,p){ const [x,y,z]=p,w=p[3]??1; return [m[0]*x+m[4]*y+m[8]*z+m[12]*w,m[1]*x+m[5]*y+m[9]*z+m[13]*w,m[2]*x+m[6]*y+m[10]*z+m[14]*w,m[3]*x+m[7]*y+m[11]*z+m[15]*w] }
};

/* ── Түстер ── */
const _cc={};
function hex(h){ if(Array.isArray(h)) return h; if(_cc[h]) return _cc[h]; const n=parseInt(h.slice(1),16); return _cc[h]=[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255] }

/* ── Геометрия құрастырушы ── */
class Geo{
  constructor(){ this.a=[]; this.m=null }
  v(x,y,z,nx,ny,nz,c){
    const m=this.m;
    if(m){ const X=m[0]*x+m[4]*y+m[8]*z+m[12],Y=m[1]*x+m[5]*y+m[9]*z+m[13],Z=m[2]*x+m[6]*y+m[10]*z+m[14];
      let NX=m[0]*nx+m[4]*ny+m[8]*nz,NY=m[1]*nx+m[5]*ny+m[9]*nz,NZ=m[2]*nx+m[6]*ny+m[10]*nz; const L=Math.hypot(NX,NY,NZ)||1;
      x=X;y=Y;z=Z;nx=NX/L;ny=NY/L;nz=NZ/L }
    this.a.push(x,y,z,nx,ny,nz,c[0],c[1],c[2]);
  }
  q(p1,p2,p3,p4,n,c){ this.v(...p1,...n,c);this.v(...p2,...n,c);this.v(...p3,...n,c);this.v(...p1,...n,c);this.v(...p3,...n,c);this.v(...p4,...n,c) }
  tf(m,fn){ const o=this.m; this.m=o?M4.mul(o,m):m; fn(); this.m=o; return this }
  box(x,y,z,w,h,d,col){ const c=hex(col),x0=x-w/2,x1=x+w/2,y0=y,y1=y+h,z0=z-d/2,z1=z+d/2;
    this.q([x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1],[0,1,0],c); this.q([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],[0,-1,0],c);
    this.q([x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1],[1,0,0],c); this.q([x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1],[-1,0,0],c);
    this.q([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],[0,0,1],c); this.q([x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[0,0,-1],c); return this }
  cyl(x,y,z,rb,rt,h,col,seg=20,o={}){ const sx=o.sx||1,sz=o.sz||1,cols=Array.isArray(col)&&typeof col[0]==="string"?col.map(hex):null,c0=cols?null:hex(col);
    const ny=(rb-rt)/h; for(let i=0;i<seg;i++){ const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2,c=cols?cols[i%cols.length]:c0;
      const C0=Math.cos(a0),S0=Math.sin(a0),C1=Math.cos(a1),S1=Math.sin(a1);
      const n0=[C0,ny,S0],n1=[C1,ny,S1];
      const b0=[x+C0*rb*sx,y,z+S0*rb*sz],b1=[x+C1*rb*sx,y,z+S1*rb*sz],t0=[x+C0*rt*sx,y+h,z+S0*rt*sz],t1=[x+C1*rt*sx,y+h,z+S1*rt*sz];
      this.v(...b0,...n0,c);this.v(...b1,...n1,c);this.v(...t1,...n1,c);this.v(...b0,...n0,c);this.v(...t1,...n1,c);this.v(...t0,...n0,c);
      if(rt>0&&!o.open){ this.v(x,y+h,z,0,1,0,c);this.v(...t0,0,1,0,c);this.v(...t1,0,1,0,c) }
      if(o.bottom){ this.v(x,y,z,0,-1,0,c);this.v(...b0,0,-1,0,c);this.v(...b1,0,-1,0,c) } } return this }
  sph(x,y,z,rx,ry,rz,col,seg=14,o={}){ const c=hex(col),la=o.half?seg/2:seg; const P=(i,j)=>{ const th=i/seg*Math.PI,ph=j/seg*2*Math.PI;
      const nx=Math.sin(th)*Math.cos(ph),ny=Math.cos(th),nz=Math.sin(th)*Math.sin(ph); return [[x+nx*rx,y+ny*ry,z+nz*rz],[nx/rx,ny/ry,nz/rz]] };
    for(let i=0;i<la;i++) for(let j=0;j<seg;j++){ const A=P(i,j),B=P(i+1,j),C=P(i+1,j+1),D=P(i,j+1);
      for(const p of [A,B,C,A,C,D]){ const L=Math.hypot(...p[1]); this.v(...p[0],p[1][0]/L,p[1][1]/L,p[1][2]/L,c) } } return this }
  roof(x,y,z,w,h,d,col){ const c=hex(col),x0=x-w/2,x1=x+w/2,zf=z+d/2,zb=z-d/2,yt=y+h; let L=Math.hypot(d/2,h);

const VS=`attribute vec3 aP,aN,aC;uniform mat4 uVP,uM,uLVP;varying vec3 vN,vC,vW;varying vec4 vL;

const FS=`precision highp float;varying vec3 vN,vC,vW;varying vec4 vL;uniform sampler2D uSh;uniform vec3 uL,uSun,uSky,uGnd,uFog,uEye,uEmit;uniform float uA,uUnlit,uFN,uFF,uTex;

float sh(){vec3 p=vL.xyz/vL.w*.5+.5;if(p.x<0.||p.x>1.||p.y<0.||p.y>1.||p.z>1.)return 1.;float s=0.;
for(int i=-1;i<=1;i++)for(int j=-1;j<=1;j++){s+=p.z-.0015>un(texture2D(uSh,p.xy+vec2(float(i),float(j))*uTex))?0.:1.;}return s/9.;}

vec3 h=mix(uGnd,uSky,n.y*.5+.5);col=vC*(h+uSun*d*s);col=1.-exp(-col*1.5);}
col+=uEmit;float f=clamp((distance(vW,uEye)-uFN)/(uFF-uFN),0.,1.);col=mix(col,uFog,f*f*(3.-2.*f));gl_FragColor=vec4(col,uA);}`;
const SVS=`attribute vec3 aP;uniform mat4 uVP,uM;void main(){gl_Position=uVP*uM*vec4(aP,1.);}`;
const SFS=`precision highp float;vec4 pk(float d){vec4 b=vec4(1.,255.,65025.,16581375.);vec4 r=fract(d*b);r-=r.yzww*vec4(1./255.,1./255.,1./255.,0.);return r;}
void main(){gl_FragColor=pk(gl_FragCoord.z);}`;
const KVS=`attribute vec2 aP;varying float vY;void main(){vY=aP.y;gl_Position=vec4(aP,.9999,1.);}`;
const KFS=`precision mediump float;varying float vY;uniform vec3 uTop,uHor;void main(){float t=clamp(vY*.5+.5,0.,1.);gl_FragColor=vec4(mix(uHor,uTop,pow(t,.8)),1.);}`;

function hash2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s) }

/* ── Әлем: жер, таулар, өзен, көпір, ағаштар ── */
function buildWorld(GRID){
  const g=new Geo(), R=150, N=110, half=GRID/2, RIVER_X=half+3.6;
  const height=(x,z)=>{ const d=Math.max(Math.abs(x),Math.abs(z)); if(Math.abs(x-RIVER_X)<2.2) return -.02; if(d<half+1.5) return 0;
    const k=Math.min(1,(d-half-1.5)/18); return fbm(x*.08,z*.08)*k*k*4 };
  const col=(x,z,h)=>{ const n=fbm(x*.12+3,z*.12), m=fbm(x*.35,z*.35);
    let c=mixc("#adb55d","#e3d285",Math.min(1,Math.max(0,(n-.25)*1.8))); c=mixc(c,"#7f9a45",Math.min(.8,Math.max(0,m-.48)*2.4));
    if(Math.abs(x-RIVER_X)<1.6) c=mixc(c,"#cdbf8e",.7); if(h>2.2) c=mixc(c,"#8f8c6c",Math.min(1,(h-2.2)/2)); return c };
  const S=R*2/N;
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){ const x0=-R+i*S,z0=-R+j*S,x1=x0+S,z1=z0+S;
    const P=(x,z)=>{ const h=height(x,z); const e=.4,hx=height(x+e,z)-height(x-e,z),hz=height(x,z+e)-height(x,z-e); let n=[-hx,2*e,-hz]; const L=Math.hypot(...n); return [[x,h,z],n.map(v=>v/L),col(x,z,h)] };
    const a=P(x0,z0),b=P(x1,z0),c=P(x1,z1),d=P(x0,z1); for(const p of [a,b,c,a,c,d]) g.v(...p[0],...p[1],p[2]) }
  // өзен
  g.box(RIVER_X,-.06,0,2.6,.07,R*2,"#4b93bd");
  // көпір (видеодағыдай доға)
  const bz=-1.5; for(let i=0;i<=16;i++){ const t=i/16-.5,x=RIVER_X+t*3.6,y=.32*(1-4*t*t);
    g.box(x,y,bz,.24,.04,.7,"#8a6440");
    if(i%2===0){ g.box(x,y,bz+.33,.03,.2,.03,C.dwood); g.box(x,y,bz-.33,.03,.2,.03,C.dwood) } }
  for(let i=0;i<16;i++){ const t0=i/16-.5,t1=(i+1)/16-.5,xa=RIVER_X+t0*3.6,xb=RIVER_X+t1*3.6,ya=.32*(1-4*t0*t0)+.18,yb=.32*(1-4*t1*t1)+.18;
    for(const zz of [bz+.33,bz-.33]) g.tf(M4.chain(M4.T((xa+xb)/2,(ya+yb)/2,zz),M4.RZ(Math.atan2(yb-ya,xb-xa))),()=>g.box(0,0,0,Math.hypot(xb-xa,yb-ya)+.01,.03,.035,C.dwood)) }
  // таулар
  const r=rng(42);
  for(let i=0;i<44;i++){ const a=i/44*Math.PI*2+r()*.15, d=(i%2?105:135)+r()*30, x=Math.cos(a)*d, z=Math.sin(a)*d, h=(i%2?16:26)+r()*22, w=14+r()*14;
    mountain(g,x,z,w,h,r) }
  // сыртқы ағаштар
  for(let i=0;i<120;i++){ const a=r()*Math.PI*2,d=half+2.5+r()*22,x=Math.cos(a)*d,z=Math.sin(a)*d; if(Math.abs(x-RIVER_X)<2.4) continue;
    const y=height(x,z); g.tf(M4.T(x,y,z),()=>{ if(r()<.6){ cypress(g,0,0,1.3+r()*.8); if(r()<.5) cypress(g,.3,.2,1.1) } else roundTree(g,0,0,1.6+r()*.8) }) }
  return {geo:g, RIVER_X};
}
function mountain(g,cx,cz,w,h,r){ const seg=13; const pts=[]; for(let k=0;k<seg;k++){ const a=k/seg*Math.PI*2; const rr=w*(.6+r()*.5); pts.push([cx+Math.cos(a)*rr,0,cz+Math.sin(a)*rr]) }
  const top=[cx+(r()-.5)*w*.3,h,cz+(r()-.5)*w*.3];
  const mid=pts.map(p=>[p[0]+(top[0]-p[0])*.5+(r()-.5)*w*.3, h*(.3+r()*.35), p[2]+(top[2]-p[2])*.5+(r()-.5)*w*.3]);
  const tri=(a,b,c,ca,cb,cc)=>{ const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]]; let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
    const L=Math.hypot(...n)||1; n=n.map(q=>q/L); if(n[1]<0) n=n.map(q=>-q); g.v(...a,...n,hex(ca));g.v(...b,...n,hex(cb));g.v(...c,...n,hex(cc)) };
  const rock="#7d8590",rock2="#9a937f",snow="#f6f4f0";
  for(let k=0;k<seg;k++){ const a=pts[k],b=pts[(k+1)%seg],ma=mid[k],mb=mid[(k+1)%seg];
    tri(a,b,mb,rock2,rock2,rock); tri(a,mb,ma,rock2,rock,rock); tri(ma,mb,top,snow,snow,snow) } }

const $=id=>document.getElementById(id);
let E, world, cache={}, objs=[], sel=null, flash={i:-1,t:0}, sceneDirty=true, flagMeshes={};
const cellXZ=(i,big)=>{ const [r,c]=rc(i); return [c-GRID/2+.5+(big?.5:0), r-GRID/2+.5+(big?.5:0)] };
function getModel(key,l){
  const ck=key==="tower"?key+Math.min(3+l,9):key; if(cache[ck]) return cache[ck];
  const g=new Geo(); MODELS[key](g,{l}); const parts=(ANIM[key]?ANIM[key]():[]).map(p=>({mesh:E.mesh(p.geo),anim:p.anim}));
  return cache[ck]={mesh:E.mesh(g),parts};
}
function flagMesh(col){ return flagMeshes[col]||(flagMeshes[col]=E.mesh((()=>{ const g=new Geo(); g.box(.15,0,0,.3,.19,.01,col); return g })())) }
function rebuildScene(){
  const prev={}; objs.forEach(o=>prev[o.i]=o);
  objs=[]; const now=Date.now();
  S.g.forEach((x,i)=>{ if(!x||x[0]==="x") return;
    let key=x[0], building=false;
    if(key==="d") key=x[1]; else if(B[key]&&x[2]&&x[2]>now){ building=true }
    const big=B[x[0]]&&B[x[0]].big, [px,pz]=cellXZ(i,big);
    const sig=(building?"scaf":key)+"|"+x[1], p=prev[i];
    const rot=key.startsWith("d_")?((i*2.399)%6.28):0;
    objs.push({i,key,big,x:px,z:pz,rot,building,l:x[1],sig,born:p&&p.sig===sig?p.born:now,label:x[3]||""});
  });
  sceneDirty=false;
}
function ghostMesh(){ if(cache._ghost) return cache._ghost; const g=new Geo(); g.box(0,0,0,.96,.012,.96,"#ffd54a"); return cache._ghost=E.mesh(g) }
function borderMesh(){ const k="_border"+S.land; if(cache[k]) return cache[k]; const g=new Geo(),h=S.land/2;
  for(let i=0;i<S.land*4;i++){ const t=(i%S.land)+.5-h, side=Math.floor(i/S.land); const [x,z]=side===0?[t,-h]:side===1?[t,h]:side===2?[-h,t]:[h,t];
    g.box(x,0,z,side<2?.4:.035,.012,side<2?.035:.4,"#fffbe8") }
  return cache[k]=E.mesh(g) }
const easeBack=t=>{ const c=1.7; return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2) };
function frame(t){
  if(sceneDirty) rebuildScene();
  const items=[{mesh:world,M:M4.I(),noShadow:false}], now=Date.now();
  for(const o of objs){
    if(o.building && S.g[o.i] && S.g[o.i][2]<=now){ sceneDirty=true; after(); }
    const sc=easeBack(Math.min(1,(now-o.born)/450))*(o.building?1:1+Math.min(o.l-1,8)*.02);
    const M=M4.chain(M4.T(o.x,0,o.z),M4.RY(o.rot),M4.S(sc));
    const emit=flash.i===o.i&&now-flash.t<350?[.18,.15,.05]:null;
    const md=getModel(o.building?"scaffold":o.key,o.l);
    items.push({mesh:md.mesh,M,emit});
    if(!o.building) for(const p of md.parts) items.push({mesh:p.mesh,M:M4.mul(M,p.anim(t)),emit});
    if(o.key==="flag") items.push({mesh:flagMesh(S.flag.c),M:M4.chain(M,M4.T(.012,.78,0),M4.RY(Math.sin(t*.0016)*.35))});
  }
  const ov=[{mesh:borderMesh(),M:M4.T(0,.01,0),unlit:true,alpha:.4,noShadow:true}];
  if(sel!=null){ const [x,z]=cellXZ(sel,false); ov.push({mesh:ghostMesh(),M:M4.T(x,.015,z),unlit:true,alpha:.35+.25*Math.sin(t*.008),noShadow:true}) }
  E.render(items,ov);
  updateLabels();
  requestAnimationFrame(frame);
}
/* Белгілер (@атаулар, құрылыс %) */
const labelEls={};
function updateLabels(){
  const seen={}, now=Date.now(), box=$("labels");
  for(const o of objs){
    let html=null, h=.75, cls="lbl";
    if(o.building){ const x=S.g[o.i], tot=buildTime(x[1]-1), pct=Math.max(0,Math.min(99,Math.round(100-(x[2]-now)/tot*100))); html=`🏗 ${pct}%`; h=.65; cls="lbl b" }
    else if(o.key==="flag"){ html=`<span class="mini" style="background:${S.flag.c}">${S.flag.s}</span> ${esc(S.name)}`; h=1.25; cls="lbl f" }
    else if(o.label){ html=`@${esc(o.label)}`; h=o.key.startsWith("yurt3")?1.05:o.key==="yurt2"?.85:.7 }
    if(!html) continue;
    const p=E.project(o.x,h,o.z); if(!p||p[2]>20) continue;
    let el=labelEls[o.i]; if(!el){ el=labelEls[o.i]=document.createElement("div"); box.appendChild(el) }
    if(el._h!==html){ el.innerHTML=html; el._h=html } el.className=cls;
    el.style.transform=`translate(${p[0]}px,${p[1]}px) translate(-50%,-100%) scale(${Math.max(.55,Math.min(.95,7/p[2]))})`; seen[o.i]=1;
  }
  for(const k in labelEls) if(!seen[k]){ labelEls[k].remove(); delete labelEls[k] }
}
function floatCell(i,text){ const big=S.g[i]&&B[S.g[i][0]]&&B[S.g[i][0]].big, [x,z]=cellXZ(i,big), p=E.project(x,.6,z); if(!p) return;
  const f=document.createElement("div"); f.className="float"; f.textContent=text; f.style.left=p[0]+"px"; f.style.top=p[1]+"px"; document.body.appendChild(f); setTimeout(()=>f.remove(),1500) }

/* ── Басқару: саусақпен жылжыту, екі саусақпен айналдыру/үлкейту ── */
function setupControls(cv){
  const P=new Map(); let start=null, last=null, moved=0;
  const cam=E.cam, lim=()=>{ const m=GRID/2; cam.tx=Math.max(-m,Math.min(m,cam.tx)); cam.tz=Math.max(-m,Math.min(m,cam.tz)); cam.dist=Math.max(3.5,Math.min(24,cam.dist)); cam.pitch=Math.max(.22,Math.min(1.35,cam.pitch)) };
  cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); P.set(e.pointerId,[e.clientX,e.clientY]); if(P.size===1){ start={x:e.clientX,y:e.clientY,t:Date.now()}; moved=0 } last=null });
  cv.addEventListener("pointermove",e=>{ if(!P.has(e.pointerId)) return; const prev=P.get(e.pointerId); P.set(e.pointerId,[e.clientX,e.clientY]);
    if(P.size===1){ const dx=e.clientX-prev[0], dy=e.clientY-prev[1]; moved+=Math.abs(dx)+Math.abs(dy);
      if(e.buttons===2||e.shiftKey){ cam.yaw-=dx*.006; cam.pitch+=dy*.004 }
      else { const k=cam.dist*.0021, s=Math.sin(cam.yaw), c=Math.cos(cam.yaw);
        cam.tx-=(dx*c+dy*s)*k; cam.tz-=(-dx*s+dy*c)*k } }
    else if(P.size===2){ const [a,b]=[...P.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]), ang=Math.atan2(b[1]-a[1],b[0]-a[0]), my=(a[1]+b[1])/2;
      if(last){ cam.dist*=last.d/d; let da=ang-last.ang; if(da>Math.PI) da-=2*Math.PI; if(da<-Math.PI) da+=2*Math.PI; cam.yaw-=da; cam.pitch+=(my-last.my)*.004 }
      last={d,ang,my}; moved=99 }
    lim() });
  const up=e=>{ if(!P.has(e.pointerId)) return; P.delete(e.pointerId); last=null;
    if(P.size===0 && start && moved<10 && Date.now()-start.t<450) onTap(e.clientX-cv.getBoundingClientRect().left,e.clientY-cv.getBoundingClientRect().top); if(P.size===0) start=null };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up); cv.addEventListener("contextmenu",e=>e.preventDefault());
  cv.addEventListener("wheel",e=>{ e.preventDefault(); cam.dist*=Math.exp(e.deltaY*.001); lim() },{passive:false});
  $("rotL").onclick=()=>{ animCam({yaw:cam.yaw+Math.PI/4}) }; $("rotR").onclick=()=>{ animCam({yaw:cam.yaw-Math.PI/4}) };
  $("home").onclick=()=>animCam({tx:0,tz:-.5,dist:9.5,pitch:.36,yaw:.35});
}
function animCam(to){ const cam=E.cam, from={...cam}, t0=performance.now(); const step=()=>{ const k=Math.min(1,(performance.now()-t0)/450), e=1-Math.pow(1-k,3);
  for(const key in to) cam[key]=from[key]+(to[key]-from[key])*e; if(k<1) requestAnimationFrame(step) }; step() }
function focusCell(i){ const [x,z]=cellXZ(i,false), c=E.cam; animCam({tx:x+Math.sin(c.yaw)*4,tz:z+Math.cos(c.yaw)*4}) }
function onTap(px,py){
  if(!S.name) return; const hit=E.pick(px,py); if(!hit) return;
  const c=Math.floor(hit[0]+GRID/2), r=Math.floor(hit[2]+GRID/2);
  if(r<0||c<0||r>=GRID||c>=GRID) return;
  let i=idx(r,c), x=S.g[i]; if(x&&x[0]==="x"){ i=x[1]; x=S.g[i] }
  flash={i,t:Date.now()}; haptic();
  if(!unlocked(r,c)&&!(x&&x[0]==="d")) return showLand();
  if(!x){ sel=i; focusCell(i); return showBuild() }
  if(x[0]==="d"){ if(!unlocked(r,c)) return showLand(); return clearDecor(i) }
  if(x[0]==="flag") return showMe();
  showInfo(i);
}

function race(){ if(racing) return; if(bgLeft()<=0) return toast("⏰ Бүгінгі бәйге бітті. Ертең келіңіз!"); if(S.res.money<bet){ haptic("err"); return toast("❌ Ақша жетпейді") }
  racing=true; S.res.money-=bet; S.bg.n++; save(); const W=document.querySelector(".track").clientWidth-70, times=HORSES.map(()=>2600+Math.random()*2200), win=times.indexOf(Math.min(...times));
  $("go").disabled=true; $("bres").textContent="Аттар шапты! 🐎💨"; HORSES.forEach((h,i)=>{ const el=$("hr"+i); el.style.transitionDuration=times[i]+"ms"; requestAnimationFrame(()=>el.style.left=W+"px") }); haptic("heavy");
  setTimeout(()=>{ racing=false; let msg=`🏆 Бірінші: <b>${HORSES[win][1]} ${HORSES[win][0]}</b>!<br>`;
    if(win===myHorse){ const lv=active().filter(b=>b.k==="hippodrome").reduce((a,b)=>a+b.l,0), pr=Math.round(bet*3*(1+.1*lv)); S.res.money+=pr; S.st.bw=(S.st.bw||0)+1; msg+=`🎉 Сіздің атыңыз озды! <b>💰+${pr}</b>`; haptic("ok") }
    else { msg+="😔 Бұл жолы бақ қонбады..."; haptic("err") }
    if(sheetOpen&&$("bres")){ $("bres").innerHTML=msg; $("go").disabled=false; $("go").textContent="🔁 Тағы бәйге"; $("go").onclick=showGames } after() }, Math.max(...times)+300) }
/* Сыйлық */
function showGift(){ const left=20*3600e3-(Date.now()-S.daily), n=blds().length, g={wood:150+n*20,stone:80+n*12,food:120+n*15,fruit:40+n*8,money:150+n*20};
  if(left>0){ const h=Math.floor(left/3600e3),m=Math.floor(left%3600e3/60e3); return openSheet(`<h2>🎁 Күнделікті сыйлық</h2><div class="giftbox" style="animation:none;opacity:.5">🎁</div><p class="center">Келесі сыйлыққа <b>${h} сағ ${m} мин</b> қалды</p><button class="btn wide" id="share">📤 Досыңды шақыр</button>`) }
  openSheet(`<h2>🎁 Күнделікті сыйлық</h2><div class="giftbox">🎁</div><p class="center sub">Ауылыңыз неғұрлым үлкен болса, сыйлық та соғұрлым көп!</p><p class="center"><b>${fmtC(g)}</b></p><button class="btn wide gold" id="claim">Сыйлықты алу!</button>`);
  $("claim").onclick=()=>{ gain(g); S.daily=Date.now(); haptic("ok"); closeSheet(); toast("🎁 "+fmtC(g)); after() } }
function share(){ const text=`Мен «${S.name}» ауылын салып жатырмын ${S.flag.s} — ${TITLES[titleIdx()][1]}, ⭐${fmt(score())}! Сен де өз ауылыңды құр 🏡`;
  const url="https://t.me/share/url?url="+encodeURIComponent(BOT_LINK||"https://t.me")+"&text="+encodeURIComponent(text); if(inTG&&tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url,"_blank") }
/* Жетістіктер */
function checkAch(){ ACH.forEach(a=>{ if(!S.ach.includes(a[0])&&a[4]()){ S.ach.push(a[0]); gain(a[5]); haptic("ok"); setTimeout(()=>toast(`🎖 Жетістік: <b>${a[2]}</b><br>${fmtC(a[5])}`),400) } }) }
function showAch(){ openSheet(`<h2>🎖 Жетістіктер</h2><p class="sub">${S.ach.length}/${ACH.length} ашылды</p>`+ACH.map(a=>{ const on=S.ach.includes(a[0]);
  return `<div class="ach ${on?"":"off"}"><div class="i">${on?a[1]:"🔒"}</div><div><b>${a[2]}</b><div class="sub" style="margin:0">${a[3]}</div></div><div class="r">${on?"✅":fmtC(a[5])}</div></div>` }).join("")) }
/* Ту */
let fl={c:"#00AFCA",s:"☀️"};
function flagEditor(){ const prem=titleIdx()>=3; return `${flagHTML(fl,"flagbox bigflag")}<p class="sub" style="margin:0">Түсі:</p><div class="colors">${FCOLORS.map(c=>`<button data-fc="${c}" style="background:${c}" class="${c===fl.c?"on":""}"></button>`).join("")}</div>
  <p class="sub" style="margin:0">Белгісі:</p><div class="syms">${FSYMS.concat(FPREM).map(s=>`<button data-fs="${s}" class="${s===fl.s?"on":""} ${FPREM.includes(s)&&!prem?"lk":""}">${s}</button>`).join("")}</div>${prem?"":`<p class="sub">🔒 👑🐉💎🦁 — «Кент» деңгейінде ашылады</p>`}` }
function bindFlag(){ document.querySelectorAll("[data-fc]").forEach(b=>b.onclick=()=>{ fl.c=b.dataset.fc; refreshFlag() });
  document.querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>{ if(FPREM.includes(b.dataset.fs)&&titleIdx()<3) return toast("🔒 «Кент» деңгейінде ашылады"); fl.s=b.dataset.fs; refreshFlag() }) }
function refreshFlag(){ document.querySelector(".bigflag").outerHTML=flagHTML(fl,"flagbox bigflag"); document.querySelectorAll("[data-fc]").forEach(b=>b.classList.toggle("on",b.dataset.fc===fl.c)); document.querySelectorAll("[data-fs]").forEach(b=>b.classList.toggle("on",b.dataset.fs===fl.s)); haptic() }
function showMe(){ fl={...S.flag}; openSheet(`<h2>🚩 ${esc(S.name)}</h2><p class="sub">${TITLES[titleIdx()][1]} · ⭐${fmt(score())} · 👥${capacity()} · 😊${happiness()}</p>${flagEditor()}<button class="btn wide" id="saveflag">🚩 Туды көтеру · 💰100</button><button class="btn wide gold" id="share">📤 Досыңды шақыр</button>
  <p class="sub center" style="margin-top:14px">${useCloud?"☁️ Прогресс Telegram-да сақталады":"💾 Прогресс осы құрылғыда сақталады"}</p>`) }
function onboarding(){ fl={c:"#00AFCA",s:"☀️"}; const n=inTG&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user.first_name:"";
  openSheet(`<div class="center" style="font-size:52px">👴⛺</div><h2 class="center">«Өз ауылыңды құр»</h2><p class="sub center">Сен — жаңа ауылдың ақсақалысың! Киіз үй тік, бақ өсір, мешіт пен стадион сал, бәйгеге қатыс. Үйлерге достарыңның атын жаз — ауылыңды мегаполиске айналдыр 🌃</p>
  <p class="sub" style="margin:0 0 6px"><b>1. Ауылыңа ат қой:</b></p><input class="name" id="vname" maxlength="20" placeholder="${n?esc(n)+" ауылы":"Мыс: Досқала"}">
  <p class="sub" style="margin:14px 0 6px"><b>2. Туыңды жаса:</b></p>${flagEditor()}<button class="btn wide gold" id="start">🏁 Ауылды құру!</button>`);
  $("start").onclick=()=>{ const v=($("vname").value||$("vname").placeholder.replace(/^Мыс: /,"")).trim().slice(0,20); if(v.length<2) return toast("Ауылға ат қойыңыз ✍️");
    S.name=v; S.flag={...fl}; haptic("ok"); closeSheet(); save(true); renderTop(); toast("🎉 Ауыл құрылды! Жердің бос жерін басып, құрылысты бастаңыз 👆") } }

/* Оқиғалар */
$("nav").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||!S.name) return; sel=null;
  ({build:showBuild,games:showGames,gift:showGift,ach:showAch,me:showMe})[b.dataset.p]() });
$("sheetBody").addEventListener("click",e=>{ const g=k=>e.target.closest(`[data-${k}]`); let el;
  if(el=g("cat")){ buildCat=el.dataset.cat; const s=sel; showBuild(); sel=s; return }
  if(el=g("place")) return place(el.dataset.place);
  if(el=g("up")) return upgrade(+el.dataset.up);
  if(el=g("del")){ if(el.dataset.sure) return demolish(+el.dataset.del); el.dataset.sure=1; el.textContent="⚠️ Сенімдісіз бе? Тағы басыңыз"; haptic("warn"); return }
  if(el=g("lbl")){ const i=+el.dataset.lbl, v=$("lbl").value.replace(/^@/,"").trim().slice(0,18); S.g[i][3]=v||undefined; if(!v) S.g[i].length=3; haptic("ok"); closeSheet(); toast(v?`🏷 @${esc(v)} — үйі дайын!`:"Аты өшірілді"); sceneDirty=true; after(); return }
  if(el=g("h")){ if(racing) return; myHorse=+el.dataset.h; document.querySelectorAll("#pickH button").forEach(b=>b.classList.toggle("on",b===el)); haptic(); return }
  if(el=g("b")){ if(racing) return; bet=+el.dataset.b; document.querySelectorAll("#pickB button").forEach(b=>b.classList.toggle("on",b===el)); haptic(); return }
  if(e.target.id==="go") return race(); if(e.target.id==="share") return share(); if(e.target.id==="buyland") return buyLand();
  if(e.target.id==="saveflag"){ if(fl.c===S.flag.c&&fl.s===S.flag.s) return toast("Бұл ту қазір де тұр 🙂"); if(S.res.money<100){ haptic("err"); return toast("❌ 💰100 керек") }
    S.res.money-=100; S.flag={...fl}; haptic("ok"); closeSheet(); toast("🚩 Жаңа ту көтерілді!"); after() } });
function after(){ checkAch(); save(); renderTop() }
const EVENTS=[["🐪 Керуен келіп, сауда жасады!",{money:200}],["🌧 Жаңбыр жауып, егін бітік шықты!",{food:250}],["🍏 Бақ ерте піскен жеміс берді!",{fruit:120}],
  ["🎶 Ауылда той! Қонақтар сыйлық әкелді",{money:150,fruit:50}],["🪓 Көршілер ағаш әкеліп берді!",{wood:200}],["💎 Тау етегінен тас табылды!",{stone:150}],["🐺 Қасқыр шапты! Азық жоғалды...",{food:-150}]];
function randomEvent(){ if(!S.name||sheetOpen) return; let ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];
  if(ev[1].food<0&&has("army")) ev=["🪖 Әскер қасқырды қуып жіберді!",{money:100}];
  gain(ev[1]); toast(ev[0]+"<br><b>"+Object.entries(ev[1]).map(([r,v])=>RES[r]+(v>0?"+":"")+v).join(" ")+"</b>"); after() }
function sparkle(){ if(sheetOpen) return; const pr=active().filter(b=>Object.keys(B[b.k].prod).length); if(!pr.length) return; const b=pr[Math.floor(Math.random()*pr.length)]; floatCell(b.i,"+"+RES[Object.keys(B[b.k].prod)[0]]) }

/* ═════════ ІСКЕ ҚОСУ ═════════ */
function boot(){
  try{ E=new Engine($("gl")) }catch(err){ $("labels").innerHTML=`<div class="err">3D қосылмады: ${esc(err.message)}</div>`; console.error(err); return }
  const w=buildWorld(GRID); world=E.mesh(w.geo); setupControls($("gl"));
  storeGet(raw=>{
    try{ S=raw?JSON.parse(raw):null }catch(e){ S=null } if(!S||!S.g||S.g.length!==GRID*GRID) S=freshState();
    S.st=S.st||{}; S.ach=S.ach||[]; S.bg=S.bg||{d:"",n:0};
    const away=Math.min((Date.now()-(S.t||Date.now()))/1000,OFFLINE_MAX_H*3600);
    renderTop(); requestAnimationFrame(frame);
    if(!S.name) onboarding();
    else if(away>120){ const before={...S.res}; tick(away); const got={}; for(const k in RES) got[k]=Math.floor(S.res[k]-before[k]); renderTop();
      openSheet(`<div class="center" style="font-size:56px">👋</div><h2 class="center">Қайта келдіңіз!</h2><p class="sub center">Сіз жоқта (${(away/3600).toFixed(1)} сағ) ауыл тұрғындары еңбек етті:</p><p class="center" style="font-size:18px"><b>${fmtC(got)}</b></p>
      ${away>=OFFLINE_MAX_H*3600-1?`<p class="sub center">💡 Қойма толды — ${OFFLINE_MAX_H} сағаттан артық жиналмайды.</p>`:""}<button class="btn wide gold" onclick="closeSheet()">Тамаша! 🔥</button>`) }
    let last=Date.now(), n=0;
    setInterval(()=>{ const now=Date.now(); tick((now-last)/1000); last=now; n++; renderTop(); if(n%4===0) sparkle(); if(n%30===0){ checkAch(); save() } if(n%150===0&&Math.random()<.6) randomEvent() },1000);
    save();
  });
}
boot();

setTimeout(()=>{ const h=document.getElementById("hint"); if(h) h.style.opacity=0 },9000);
</script>
</body>
</html>
